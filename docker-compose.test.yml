# Postgres lokal khusus test integrasi (data dibuang, tidak pernah dipakai untuk prod).
# Jalankan: npm run test:db:up
# Lalu set: TEST_DATABASE_URL=postgresql://siaga:siaga@localhost:5433/siaga_test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siaga
      POSTGRES_PASSWORD: siaga
      POSTGRES_DB: siaga_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siaga -d siaga_test"]
      interval: 2s
      timeout: 3s
      retries: 15
